<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍥 Naruto Hand Jutsu</title>
  
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Video Input -->
  <video id="v_src" autoplay playsinline></video>
  
  <!-- Canvas for Effects -->
  <canvas id="out"></canvas>
  
  <!-- Darkness Overlay -->
  <div class="darkness"></div>
  
  <!-- Vignette -->
  <div class="vignette"></div>
  
  <!-- Letterbox -->
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>
  
  <!-- Jutsu FX Videos -->
  <video id="naruto-fx" class="fx" src="assets/naruto.mp4" muted playsinline></video>
  <video id="sasuke-fx" class="fx" src="assets/sasuke.mp4" muted playsinline></video>
  
  <!-- Character Select Screen -->
  <div id="character-select">
    <h1 class="char-select-title">⚡ Choose Your Ninja ⚡</h1>
    <div class="char-grid"></div>
  </div>
  
  <!-- HUD Container -->
  <div id="hud"></div>

  <!-- JavaScript Modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
